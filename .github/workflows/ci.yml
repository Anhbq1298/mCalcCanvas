name: CI

# Every push and pull request runs the full validation; GitHub Pages is
# deployed only from main, and only after all checks have passed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Composite-only changes (the design page, its worksheet, the FEM module, docs, unit tests) run only the
      # composite browser tests; anything else runs the whole suite.
      - name: Choose the browser tests
        id: scope
        env:
          BEFORE: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: |
          files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" 2>/dev/null || echo ALL)
          echo "$files"
          scope=composite
          [ -z "$files" ] && scope=full
          for f in $files; do
            case "$f" in
              src/tools/composite/*|src/engineering/fem/*|templates/Composite_Beam_EC4.mCCV|tools/templates/gen_composite.mjs|tools/templates/sizes_composite.json|tools/templates/reference_*|docs/*|src/tests/unit/*|src/tests/integration/composite-tool.spec.ts) ;;
              *) scope=full ;;
            esac
          done
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.scope == 'composite'
        run: npx playwright test src/tests/integration/composite-tool.spec.ts
      - if: steps.scope.outputs.scope != 'composite'
        run: UI_SNAPSHOTS=1 npm run test:e2e
      - name: Upload UI snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-snapshots
          path: test-results/ui-snapshots
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: [checks, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: touch dist/.nojekyll
      - name: Publish dist/ to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
